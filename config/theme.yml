name: vivawatches
display_name: VIVA Watches
version: 1.0.0
author:
  name: "VIVA Watches"
  email: "kontakt@vivawatches.pl"
  url: "https://vivawatches.pl"

meta:
  compatibility:
    from: 9.1.0
    to: ~
    framework: bootstrap-v5.3.3

  available_layouts:
    layout-full-width:
      name: Full Width
      description: No side columns, ideal for distraction-free pages such as product pages.
    layout-both-columns:
      name: Three Columns
      description: One large central column and 2 side columns.
    layout-left-column:
      name: Two Columns, small left column
      description: Two columns with a small left column
    layout-right-column:
      name: Two Columns, small right column
      description: Two columns with a small right column

assets:
  css:
    all:
      - id: viva-custom
        path: assets/css/theme.css
        media: all
        priority: 500
  js:
    all:
      - id: viva-custom-js
        path: assets/js/theme.js
        priority: 500

global_settings:
  configuration:
    HOME_FEATURED_NBR: 8
    NEW_PRODUCTS_NBR: 8
    BLOCKSPECIALS_SPECIALS_NBR: 4
    PS_BLOCK_BESTSELLERS_TO_DISPLAY: 8

  hooks:
    modules_to_unhook:
      displayTop:
        - ps_searchbar
    modules_to_hook:
      displaySearch:
        - ps_searchbar
      displayNav1:
        - ps_contactinfo
        - ~
      displayNav2:
        - ps_languageselector
        - ps_currencyselector
        - ps_customersignin
        - ps_shoppingcart
        - ~
      displayTop:
        - ps_mainmenu
        - ~
      displayHome:
        - ps_imageslider
        - ps_customtext
        - ps_featuredproducts
        - ps_banner
        - ps_newproducts
        - ps_bestsellers
        - ~
      displayFooterBefore:
        - ps_socialfollow
        - ps_emailsubscription
        - blockreassurance
        - ~
      displayFooter:
        - ps_linklist
        - ps_customeraccountlinks
        - ps_contactinfo
        - ~
      displayFooterAfter:
        - blockreassurance
        - ~

parent: hummingbird

theme_settings:
  rtl_generation: false
  default_layout: layout-full-width
  layouts:
    category: layout-left-column
    best-sales: layout-left-column
    new-products: layout-left-column
    prices-drop: layout-left-column
    contact: layout-left-column
    manufacturer: layout-left-column
    supplier: layout-left-column
